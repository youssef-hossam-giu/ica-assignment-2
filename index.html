<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Roast Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <span class="deliver-label">📍 DELIVER TO</span>
      <button class="address">Campus Dorms, Bldg B (ID: 19006468) ▾</button>
    </header>

    <main class="content">
      <input class="search" type="search" placeholder="Search restaurants, groceries in Daily Roast Cafe...">

      <section class="promo">
        <h2>Afternoon Sweet Treat Deal</h2>
        <p>Handcrafted pour-over coffee</p>
        <span class="code">🏷️ CODE: ICA-6468</span>
      </section>

      <h2 class="section-title">Explore Categories</h2>
      <section class="categories">
        <button class="category"><span class="icon">☕</span>Espresso</button>
        <button class="category"><span class="icon">🥐</span>Pastries</button>
        <button class="category"><span class="icon">🥪</span>Sandwiches</button>
        <button class="category"><span class="icon">🧋</span>Cold Brew</button>
      </section>

      <h2 class="section-title">Featured Store</h2>
      <article class="store-card">
        <div class="store-image">🏬</div>
        <div class="store-info">
          <div class="store-top">
            <h3>The Parisian Bakery</h3>
            <span class="rating">★ 4.9</span>
          </div>
          <p class="store-tags">French Pastries • Breads</p>
          <p class="store-meta">🕒 20-30 min · EGP 45</p>
        </div>
      </article>
    </main>

    <nav class="bottom-nav">
      <a href="#" class="nav-item active"><span>🏠</span>Home</a>
      <a href="#" class="nav-item"><span>🔍</span>Search</a>
      <a href="#" class="nav-item"><span>📋</span>Orders</a>
      <a href="#" class="nav-item"><span>👤</span>Profile</a>
    </nav>

  </div>
</body>
</html>
